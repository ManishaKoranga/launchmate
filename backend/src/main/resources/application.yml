spring:
  application:
    name: launchmate
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/launchmate}
    username: ${DB_USERNAME:launchmate}
    password: ${DB_PASSWORD:launchmate}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${PORT:8080}
  # Trust X-Forwarded-For only from internal proxies (the Next.js frontend), for per-IP rate limits.
  forward-headers-strategy: native
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      timeout: 7d
      cookie:
        name: LM_SESSION
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

launchmate:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:3000}

logging:
  level:
    com.launchmate: INFO

launchmate.ai:
  enabled: ${AI_ENABLED:true}
  model: ${AI_MODEL:claude-opus-5-5}
  timeout: ${AI_TIMEOUT:120s}
  max-retries: 2

launchmate.storage:
  local-path: ${STORAGE_LOCAL_PATH:./uploads}
