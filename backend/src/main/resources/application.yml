spring:
  application:
    name: launchmate
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/launchmate}
    username: ${DB_USERNAME:launchmate}
    password: ${DB_PASSWORD:launchmate}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      timeout: 7d
      cookie:
        name: LM_SESSION
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

launchmate:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:3000}

logging:
  level:
    com.launchmate: INFO
